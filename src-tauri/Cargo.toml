[package]
name = "rocket-launcher"
# Not the app version. The version lives only in package.json (tauri.conf.json: "version": "../package.json") and CI
# overrides it with `tauri build --config`; build.rs aligns the executable's VERSIONINFO strings with it. Keeping this at
# 0.0.0 means a release never touches Cargo.toml or Cargo.lock.
version = "0.0.0"
description = "Launcher e indicizzatore di file per Windows"
authors = ["Leonardo Stagliano", "Yashvardhan Gupta"]
license = "GPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1.0"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jwalk = "0.8"
once_cell = "1.18"
systemicons = "0.9" 
image = "0.24"
base64 = "0.21"
bincode = "1.3"
windows = { version = "0.52", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

[target."cfg(windows)".dependencies]
tauri-plugin-single-instance = "2.4.1"
# Windows build number, to pick Mica (Windows 11) or Acrylic (Windows 10). Already used by Tauri itself.
windows-version = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
