<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RocketLauncher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="container">
    <div class="header" data-tauri-drag-region>
      <div class="logo-area" data-tauri-drag-region>
        <img src="assets/logo.svg" alt="RocketLauncher" class="app-logo" />
      </div>

      <div class="search-wrapper" id="search-wrapper">
        <div id="chips-area" class="chips-area"></div>
        <input type="text" id="search-input" placeholder="Cerca app, file, cartelle e comandi" autofocus
          autocomplete="off" spellcheck="false" aria-label="Cerca" />
      </div>

      <div class="settings-icon" id="settings-btn" role="button" title="Impostazioni (Tab)" aria-label="Impostazioni">⚙️</div>
    </div>

    <div id="settings-panel" class="settings-panel hidden" aria-label="Impostazioni">
      <div class="settings-row">
        <label class="toggle-switch-container" title="Mostra gli elementi aperti di recente quando la ricerca è vuota">
          <input type="checkbox" id="show-recents-toggle">
          <span class="slider"></span>
          <span class="label-text">Mostra i recenti</span>
        </label>
        <label class="toggle-switch-container" title="Avvia RocketLauncher all'accesso a Windows">
          <input type="checkbox" id="startup-toggle" checked>
          <span class="slider"></span>
          <span class="label-text">Avvia con Windows</span>
        </label>
        <button id="clear-recents-btn" class="btn btn-danger btn-sm">Svuota recenti</button>
        <button id="reset-pos-btn" class="btn btn-secondary btn-sm"
          title="Riporta recenti, avvio con Windows, modalità statistiche e scelta rapida ai valori predefiniti">Ripristina impostazioni</button>
      </div>

      <div class="settings-row">
        <label class="setting-label no-margin">Scelta rapida</label>
        <div class="relative">
          <div id="shortcut-display" class="shortcut-display" role="button" aria-haspopup="listbox"
            title="Combinazione di tasti che mostra o nasconde RocketLauncher">Caricamento…</div>
          <div id="shortcut-dropdown" class="shortcut-dropdown hidden" aria-label="Scelte rapide disponibili"></div>
        </div>
        <div id="shortcut-msg" class="shortcut-msg margin-left-10" aria-live="polite"></div>
        <span id="app-version" class="app-version margin-left-auto"></span>
        <button id="update-btn" class="btn btn-secondary btn-sm margin-left-10">Controlla aggiornamenti</button>
      </div>

      <div class="settings-footer">
        <button id="help-btn" class="info-btn" title="Guida e documentazione" aria-label="Guida">ℹ</button>
        <label class="toggle-switch-container margin-left-auto no-margin-right toggle-red"
          title="Mostra la RAM usata da RocketLauncher nel piè di pagina">
          <span class="label-text" style="margin-right: 10px;">Modalità statistiche</span>
          <input type="checkbox" id="analytics-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div id="results-container">
      <ul id="results" aria-label="Risultati"></ul>
    </div>

    <div class="footer">
      <div id="memory-usage" class="memory-stats hidden">RAM: 0,0 MB</div>
      <div class="credits">Basato su <a href="https://github.com/YashvardhanG/Velocmd" target="_blank"
          title="Velocmd di Yashvardhan Gupta, licenza GPL-3.0">Velocmd</a> di Yashvardhan Gupta</div>
    </div>
  </div>
  <script src="main.js" type="module"></script>
</body>

</html>
