<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>RocketLauncher</title>
  <!-- Master logo "Orbita": the SAME drawing is used for the app icon, the tray icon and the mark inside the launcher
       (src/index.html repeats it as the #rl-logo symbol). The ring is thick and bright on purpose, so it still reads at 16 px. -->
  <defs>
    <linearGradient id="rl-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2B33"/><stop offset="1" stop-color="#141418"/></linearGradient>
    <!-- Front half of the orbit, expressed in the ellipse's own rotated user space. -->
    <clipPath id="rl-front"><rect x="0" y="532" width="1024" height="492"/></clipPath>
  </defs>
  <rect x="24" y="24" width="976" height="976" rx="224" fill="url(#rl-tile)"/>
  <rect x="25.5" y="25.5" width="973" height="973" rx="222.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>
  <ellipse cx="512" cy="532" rx="410" ry="166" transform="rotate(28 512 532)" fill="none" stroke="#4AA8FF" stroke-width="84" stroke-opacity="0.72"/>
  <g transform="rotate(45 512 512) translate(512 512) scale(0.9) translate(-512 -526)">
    <path d="M512 150C606 222 646 318 646 430V650C646 680 624 702 594 702H430C400 702 378 680 378 650V430C378 318 418 222 512 150Z" fill="#F5F5F7"/>
    <circle cx="512" cy="420" r="62" fill="#1B1B21"/>
    <path d="M378 520L290 608C278 620 272 636 272 652V742L378 690Z" fill="#8E8E99"/>
    <path d="M646 520L734 608C746 620 752 636 752 652V742L646 690Z" fill="#8E8E99"/>
    <path d="M512 752C556 800 566 846 512 902C458 846 468 800 512 752Z" fill="#FF7A3D"/>
  </g>
  <ellipse cx="512" cy="532" rx="410" ry="166" transform="rotate(28 512 532)" fill="none" stroke="#4AA8FF" stroke-width="84" clip-path="url(#rl-front)"/>
</svg>
